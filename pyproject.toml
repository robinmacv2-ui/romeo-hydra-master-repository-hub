[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romeo-hydra"
version = "0.1.3"
description = "ROMEO-HYDRA: offline fail-closed admissibility layer + cryptographic evidence. Core is pure Python 3.11 stdlib. Optional laboratory extras only."
readme = "PACKAGE_README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Luis Angel Vazquez Martinez", email = "robinmac.v2@gmail.com"}
]
maintainers = [
    {name = "Luis Angel Vazquez Martinez", email = "emmororromeohydra@gmail.com"}
]
keywords = [
    "romeo-hydra", "offline", "fail-closed", "admissibility", "audit",
    "sha256", "stdlib", "termux", "governance", "regtech"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# CORE is pure stdlib. No forced third-party dependencies.
dependencies = []

[project.optional-dependencies]
lab = [
    "numpy>=1.24",
]
crypto = [
    "cryptography>=41",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub"
Repository = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub"
"DOI (Version)" = "https://doi.org/10.5281/zenodo.21922106"
"DOI (Concept)" = "https://doi.org/10.5281/zenodo.21744014"
"For Evaluators" = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub/blob/main/FOR_EVALUATORS.md"
"Termux" = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub/blob/main/docs/TERMUX.md"

[project.scripts]
romeo-hydra = "romeo_hydra.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["romeo_hydra*"]
exclude = ["tests*", "examples*", "pilot*", "native*", "*.egg-info*"]

[tool.setuptools.package-data]
romeo_hydra = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
