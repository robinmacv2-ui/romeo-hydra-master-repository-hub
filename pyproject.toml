[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romeo-hydra"
version = "0.1.2"
description = "ROMEO-HYDRA: offline kernel + SHA256/RSA/Paillier HE + TFHE/HElib native-optional bridge"
readme = "PACKAGE_README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Luis Angel Vazquez Martinez", email = "robinmac.v2@gmail.com"}
]
maintainers = [
    {name = "Luis Angel Vazquez Martinez", email = "emmororromeohydra@gmail.com"}
]
keywords = [
    "romeo-hydra", "offline", "audit", "sha256", "rsa", "paillier",
    "homomorphic", "kernel-sigma", "fintech", "regtech", "edge"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# Igual que numpy: se instalan solas con pip install / pip install -e .
dependencies = [
    "numpy>=1.24",
    "cryptography>=41",
]

[project.optional-dependencies]
full = [
    "sympy>=1.12",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub"
Repository = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub"
"DOI (Version)" = "https://doi.org/10.5281/zenodo.21922106"
"DOI (Concept)" = "https://doi.org/10.5281/zenodo.21744014"
"For Evaluators" = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub/blob/main/FOR_EVALUATORS.md"
"FHE Status" = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub/blob/main/docs/FHE_STATUS.md"
"Bug Tracker" = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub/issues"

[project.scripts]
romeo-hydra = "romeo_hydra.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["romeo_hydra*"]
exclude = ["tests*", "examples*", "pilot*", "native*", "*.egg-info*"]

[tool.setuptools.package-data]
romeo_hydra = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
