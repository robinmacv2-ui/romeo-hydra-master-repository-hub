[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romeo-hydra"
version = "0.1.2"
description = "ROMEO-HYDRA: offline kernel + SHA256 + optional RSA/Paillier + TFHE/HElib bridge"
readme = "PACKAGE_README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Luis Angel Vazquez Martinez", email = "robinmac.v2@gmail.com"}
]
maintainers = [
    {name = "Luis Angel Vazquez Martinez", email = "emmororromeohydra@gmail.com"}
]
keywords = [
    "romeo-hydra", "offline", "audit", "sha256", "edge", "termux",
    "kernel-sigma", "fintech", "regtech"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# Solo deps que instalen en Termux aarch64 sin Rust/maturin.
# cryptography es OPCIONAL (extra [crypto]) — en Windows/Linux con wheels OK;
# en Termux puede fallar al compilar.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
crypto = [
    "cryptography>=41",
]
dev = [
    "pytest>=7.0",
]
# Nota: NO incluir ruff en dev — falla maturin en Termux ARM.

[project.urls]
Homepage = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub"
Repository = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub"
"DOI (Version)" = "https://doi.org/10.5281/zenodo.21922106"
"DOI (Concept)" = "https://doi.org/10.5281/zenodo.21744014"
"For Evaluators" = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub/blob/main/FOR_EVALUATORS.md"
"Termux" = "https://github.com/robinmacv2-ui/romeo-hydra-master-repository-hub/blob/main/docs/TERMUX.md"

[project.scripts]
romeo-hydra = "romeo_hydra.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["romeo_hydra*"]
exclude = ["tests*", "examples*", "pilot*", "native*", "*.egg-info*"]

[tool.setuptools.package-data]
romeo_hydra = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
